services:
  # =========================================================================
  # BeE Printer Platform - Open Source Core (AGPLv3)
  # Multi-brand management for Bambu Lab, Klipper, Prusa & Elegoo printers
  # =========================================================================
  core:
    image: ghcr.io/lqdung95ntp/bee-core:latest
    container_name: bee-platform-core
    restart: unless-stopped
    ports:
      - "${BEE_PORT:-8000}:8000"
    environment:
      - BEE_PRO_URL=http://pro:8001
      - DISCOVERY_EXTRA_SUBNETS=${DISCOVERY_EXTRA_SUBNETS:-192.168.1.0/24}
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${DATA_PATH:-./data}/core:/app/data
    tmpfs:
      - /tmp:size=64M
      - /app/logs:size=32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bee-network

  # =========================================================================
  # BeE Printer Platform - Commercial Pro Sidecar (Proprietary / Closed Source)
  # Isolated service handling Auto Swap PEI, Smart Power & Xiaozhi AI Voice
  # =========================================================================
  pro:
    image: ghcr.io/lqdung95ntp/bee-pro:latest
    container_name: bee-platform-pro
    restart: unless-stopped
    ports:
      - "${BEE_PRO_PORT:-8001}:8001"
    environment:
      - BEE_PRO_CORE_API_URL=http://core:8000
      - BEE_PRO_CORE_API_KEY=${BEE_PRO_CORE_API_KEY:-}
      - BEE_PRO_DATA_DIR=/app/data
      - BEE_PRO_LICENSE_FILE=/app/data/bee_license.key
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${DATA_PATH:-./data}/pro:/app/data
    tmpfs:
      - /tmp:size=32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      - core
    networks:
      - bee-network

  # =========================================================================
  # BeE Printer Platform - Automated Safe Update (Watchtower)
  # Automatically checks GHCR, pulls new images and updates containers gracefully
  # =========================================================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: bee-platform-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - WATCHTOWER_ROLLING_RESTART=true
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    command: bee-platform-core bee-platform-pro

networks:
  bee-network:
    driver: bridge
